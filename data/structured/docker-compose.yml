# Neo4j Community Edition 5.x with APOC configured for heap-safe streaming export.
# Usage:
#   docker compose up -d
#   docker compose exec -T neo4j cypher-shell -u neo4j -p acme-sdlc-workshop-2026 < seed_neo4j.cypher
#   docker compose exec -T neo4j cypher-shell -u neo4j -p acme-sdlc-workshop-2026 < export_neo4j_apoc.cypher
#   python3 stage_apoc_export.py --diff-apoc-dir ./export

services:
  neo4j:
    image: neo4j:5-community
    container_name: acme-sdlc-neo4j-ce
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser HTTP
      - "7687:7687"   # Bolt protocol
    environment:
      # Override NEO4J_AUTH via environment or .env in shared environments.
      NEO4J_AUTH: "${NEO4J_AUTH:-neo4j/acme-sdlc-workshop-2026}"
      # Install official APOC plugin for streaming CSV & JSONL export.
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
      # Bounded JVM heap prevents OOM during batched APOC exports.
      NEO4J_server_memory_heap_initial__size: "512M"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512M"
    volumes:
      - ./nodes:/var/lib/neo4j/import/nodes:ro
      - ./edges:/var/lib/neo4j/import/edges:ro
      - ./import:/var/lib/neo4j/import/custom:ro
      - ./export:/var/lib/neo4j/import/export
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  neo4j_data:
  neo4j_logs:
